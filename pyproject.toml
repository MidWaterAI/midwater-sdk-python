[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "midwater"
dynamic = ["version"]
description = "Python SDK for the Midwater API: send AI-agent conversations, read check results and agent health, verify webhooks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Midwater", email = "hello@midwater.ai" }]
keywords = ["midwater", "ai agents", "voice agents", "conversation quality", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4",
    "mypy>=1.5",
    "ruff>=0.4",
    "build>=1.0",
]

[project.urls]
Homepage = "https://midwater.ai"

[tool.hatch.version]
path = "src/midwater/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/midwater"]

[tool.hatch.build.targets.sdist]
include = [
    "src/midwater",
    "tests",
    "openapi",
    "fixtures",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not contract\""
markers = ["contract: live tests against a running Midwater stack (opt in with -m contract)"]
asyncio_mode = "auto"

# Coverage gate for the unit run (not the contract run):
#   pytest --cov=midwater --cov-report=term-missing --cov-fail-under=90
[tool.coverage.run]
branch = true
source = ["midwater"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# The SDK supports Python 3.9: keep typing.Optional / Union / List / Dict, which also work
# where annotations are evaluated at runtime.
ignore = ["UP006", "UP007", "UP035", "UP045"]
