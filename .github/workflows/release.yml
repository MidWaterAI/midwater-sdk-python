name: Release

# Publishes midwater to PyPI with trusted publishing (OIDC): no PyPI token is stored anywhere.
# PyPI must list this repository (MidWaterAI/midwater-sdk-python), this workflow file (release.yml) and the
# environment "pypi" as the project's trusted publisher (a "pending publisher" before the first release).
#
# - Push to main: the dry-run job builds the sdist and wheel and runs `twine check`.
# - Tag v*: the publish job checks the tag against the package version, runs the full suite, and publishes.
# - Manual run (Actions → Release → Run workflow): pick a v* tag in "Use workflow from" to publish; on a branch,
#   only the dry run runs.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" twine
      - name: The tag is the version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          v="$(python -c 'import midwater; print(midwater.__version__)')"
          test "${GITHUB_REF_NAME}" = "v${v}" || { echo "Tag ${GITHUB_REF_NAME} doesn't match the package version ${v} (src/midwater/_version.py, read by pyproject.toml)"; exit 1; }
      - run: sha256sum -c fixtures/SHA256SUMS
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src
      - run: pytest --cov=midwater --cov-report=term-missing --cov-fail-under=90
      - run: python -m build
      # The dry run: what would be uploaded is valid for PyPI.
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
