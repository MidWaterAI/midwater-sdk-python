name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check pinned contract and fixtures
        run: sha256sum -c fixtures/SHA256SUMS
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy --strict src
      - name: Unit tests with coverage
        run: pytest --cov=midwater --cov-report=term-missing --cov-fail-under=90
      - name: Build sdist and wheel
        run: python -m build
