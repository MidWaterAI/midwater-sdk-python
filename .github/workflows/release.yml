name: Release

# Publishes midwater to PyPI when a version tag (v0.1.0, …) is pushed. Uses PyPI trusted publishing (OIDC): no
# PyPI token is stored anywhere. PyPI must list this repository, this workflow file (release.yml) and the
# environment "pypi" as the project's trusted publisher (a "pending publisher" before the first release).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Tag matches the package version
        run: |
          v="$(python -c 'import midwater; print(midwater.__version__)')"
          test "${GITHUB_REF_NAME}" = "v${v}" || { echo "tag ${GITHUB_REF_NAME} != v${v}"; exit 1; }
      - run: sha256sum -c fixtures/SHA256SUMS
      - run: ruff check .
      - run: mypy --strict src
      - run: pytest --cov=midwater --cov-fail-under=90
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
