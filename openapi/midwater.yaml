openapi: 3.1.0
info:
  title: Midwater API
  version: "2026-10-08"
  summary: Send each finished AI-agent conversation to Midwater and read back its outcome, check results and agent health.
  description: |
    Midwater checks every conversation your AI agents have, voice calls and chats. Send each finished
    conversation with its transcript; Midwater scores it in the background and you read the outcome,
    the result of every check, and each agent's health.

    **Authentication.** Every request carries `Authorization: Bearer <key>`. A key belongs to one environment
    of one project: test keys start `mw_test_`, live keys `mw_live_`. Keys made before October 2026 start
    `vk_test_` / `vk_live_` and keep working. Everything you send and read is scoped to the key's environment.

    **Errors.** Every JSON error has the shape `{ "error": { "type", "message", "fields"? } }`.

    This document is the contract the Midwater SDKs are built from. Each operation is marked with
    `x-midwater-verified`: the date it was last checked against a running Midwater stack.
  contact:
    name: Midwater
    email: hello@midwater.ai
servers:
  - url: "{baseUrl}"
    description: Your Midwater API base URL.
    variables:
      baseUrl:
        default: https://api.midwater.ai
        description: Placeholder until deployment. Local stacks use http://localhost:3200.
security:
  - apiKey: []
tags:
  - name: Conversations
    description: Send finished conversations and read their results.
  - name: Health
    description: Agent and group health, measured per environment.
paths:
  /v1/conversations:
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Send a finished conversation
      description: |
        Stores a finished call or chat and queues it for scoring. Answers `202` with `status: "queued"`;
        read the result with `GET /v1/conversations/{id}` or wait for the `conversation.evaluated` webhook.

        Sending an `external_id` that already exists in this environment answers `200` with the existing
        conversation and `duplicate: true`; nothing new is created.

        Send an `Idempotency-Key` header to make retries safe: a repeated key in the same environment
        answers with the first response and the header `Idempotent-Replayed: true`. The replay does not
        compare bodies, so use a new key for a different conversation.

        A conversation without `agent.id` goes to the project's Default agent (ID `default`). A new
        `agent.id` creates the agent the first time it's seen.
      x-midwater-verified: "2026-10-08"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreate"
            example:
              external_id: call_8f2a91
              channel: voice
              started_at: "2026-10-05T14:02:11Z"
              ended_at: "2026-10-05T14:06:40Z"
              ended_by: caller
              agent: { id: front-desk, name: Front desk, version: "1.0.0" }
              transcript:
                - { speaker: agent, text: "Thanks for calling, this call may be recorded. How can I help?", start_ms: 0, end_ms: 2400 }
                - { speaker: user, text: "I need to move my appointment to Thursday.", start_ms: 2900, end_ms: 5100, asr_confidence: 0.93 }
                - { speaker: agent, text: "Sure, I have Thursday at 10 AM. Does that work?", start_ms: 5600, end_ms: 8200 }
                - { speaker: user, text: "Yes, that is perfect.", start_ms: 8700, end_ms: 9900, asr_confidence: 0.96 }
                - { speaker: agent, text: "Great, you are all set for Thursday at 10 AM.", start_ms: 61500, end_ms: 64000 }
              events:
                - { type: tool_call, name: reschedule_appointment, status: success, at_ms: 61000 }
              metadata: { language: en }
      responses:
        "202":
          description: Accepted and queued for scoring.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationAccepted" }
              example: { id: cmv0187nm005po3016rag4dcg, status: queued }
        "200":
          description: A conversation with this `external_id` already exists in this environment; it is returned instead of a duplicate.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationAccepted" }
              example: { id: cmv0187nm005po3016rag4dcg, status: done, duplicate: true }
        "400": { $ref: "#/components/responses/InvalidJson" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }
  /v1/conversations/{id}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Get a conversation and its results
      description: |
        Returns the conversation, its scoring `status`, its `outcome` and the result of every check.
        `id` is Midwater's ID or your `external_id`. Results appear once `status` is `done`.
      x-midwater-verified: "2026-10-08"
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /v1/conversations/{id}/feedback:
    post:
      tags: [Conversations]
      operationId: createFeedback
      summary: Confirm or correct a check result
      description: |
        Records your team's answer for one check on one conversation (stored as a label with source `api`).
        `id` is Midwater's ID or your `external_id`. Each call adds a label; it isn't idempotent.
      x-midwater-verified: "2026-10-08"
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackCreate" }
            example: { check_key: need_unresolved, verdict: fail, note: "Caller hung up before the booking went through." }
      responses:
        "200":
          description: The label was stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feedback" }
        "400": { $ref: "#/components/responses/InvalidJson" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such conversation, or the conversation has no result for `check_key` (`"No result for check <key>"`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }
  /v1/conversations/{id}/turns:
    post:
      tags: [Conversations]
      operationId: streamTurns
      summary: Stream turns (not available yet)
      description: Real-time turn streaming is not available yet and always answers `501`. Send one request per finished conversation to `POST /v1/conversations`.
      x-midwater-verified: "2026-10-08"
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "501":
          description: Not implemented.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/agents/{agent_id}/health:
    get:
      tags: [Health]
      operationId: getAgentHealth
      summary: Get an agent's health
      description: The agent's health in the key's environment, with 7- and 30-day windows. `agent_id` is the `agent.id` you send (or `default`).
      x-midwater-verified: "2026-10-08"
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/SafeId" }
      responses:
        "200":
          description: The agent's health.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /v1/groups/{group_id}/health:
    get:
      tags: [Health]
      operationId: getGroupHealth
      summary: Get a group's health
      description: The worst status among the group's active agents, each agent's status, and totals across them, in the key's environment.
      x-midwater-verified: "2026-10-08"
      parameters:
        - name: group_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/SafeId" }
      responses:
        "200":
          description: The group's health.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
webhooks:
  conversation.evaluated:
    post:
      summary: A conversation was scored
      description: Sent to webhook destinations subscribed to `conversation.evaluated` when scoring finishes.
      parameters: &webhookHeaders
        - $ref: "#/components/parameters/MidwaterSignature"
        - $ref: "#/components/parameters/MidwaterEvent"
        - $ref: "#/components/parameters/MidwaterDelivery"
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEnvelope"
                - properties:
                    type: { const: conversation.evaluated }
                    data: { $ref: "#/components/schemas/ConversationEvaluatedData" }
      responses: &webhookResponses
        "2XX": { description: "Any 2xx marks the delivery as delivered. Anything else, or no answer within 5 seconds, is retried." }
  check.failed:
    post:
      summary: A check failed
      description: Sent by a route (Routes & destinations in the app) when an active check matching the route fails on a covered agent.
      parameters: *webhookHeaders
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEnvelope"
                - properties:
                    type: { const: check.failed }
                    data: { $ref: "#/components/schemas/CheckFailedData" }
      responses: *webhookResponses
  check.failed.digest:
    post:
      summary: Hourly digest of failed checks
      description: Sent instead of individual `check.failed` events by a route set to deliver as an hourly digest.
      parameters: *webhookHeaders
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEnvelope"
                - properties:
                    type: { const: check.failed.digest }
                    data:
                      type: object
                      required: [count, items]
                      properties:
                        count: { type: integer }
                        items: { type: array, items: { $ref: "#/components/schemas/CheckFailedData" } }
      responses: *webhookResponses
  agent.health_changed:
    post:
      summary: An agent's health changed
      description: Sent when an agent's status changes and `watch` or `at_risk` is the old or new status. Becoming measured as healthy, or going quiet, sends nothing.
      parameters: *webhookHeaders
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEnvelope"
                - properties:
                    type: { const: agent.health_changed }
                    data: { $ref: "#/components/schemas/AgentHealthChangedData" }
      responses: *webhookResponses
  group.health_changed:
    post:
      summary: A group's health changed
      description: Sent when a group's status changes and `watch` or `at_risk` is the old or new status.
      parameters: *webhookHeaders
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEnvelope"
                - properties:
                    type: { const: group.health_changed }
                    data: { $ref: "#/components/schemas/GroupHealthChangedData" }
      responses: *webhookResponses
  test:
    post:
      summary: Test event
      description: Sent when someone presses "Send test event" on a destination in the app.
      parameters: *webhookHeaders
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEnvelope"
                - properties:
                    type: { const: test }
                    data:
                      type: object
                      properties:
                        message: { type: string, example: This is a test event from Midwater. }
                        destination: { type: string }
                        url: { type: string, format: uri }
      responses: *webhookResponses
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "An API key: `mw_test_…` for the test environment, `mw_live_…` for live. Older `vk_test_…` / `vk_live_…` keys also work."
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Any string unique to this conversation, for example your `external_id`. A repeated key in the same environment answers with the first response; bodies aren't compared.
      schema: { type: string }
    ConversationId:
      name: id
      in: path
      required: true
      description: Midwater's conversation ID or your `external_id`.
      schema: { type: string }
    MidwaterSignature:
      name: Midwater-Signature
      in: header
      required: true
      description: "`t=<unix seconds>,v1=<hex>`: HMAC-SHA256 of `<t>.<raw body>` keyed with the environment's signing secret (`whsec_…`). Also sent as `Verdict-Signature` with the same value until launch."
      schema: { type: string, example: "t=1791493925,v1=5f0c…" }
    MidwaterEvent:
      name: Midwater-Event
      in: header
      required: true
      description: The event type, the same as the body's `type`. Also sent as `Verdict-Event` until launch.
      schema: { type: string }
    MidwaterDelivery:
      name: Midwater-Delivery
      in: header
      required: true
      description: The delivery ID; the same on every retry of one delivery. Also sent as `Verdict-Delivery` until launch.
      schema: { type: string }
  headers:
    IdempotentReplayed:
      description: "`true` when this response is a replay of an earlier request with the same `Idempotency-Key`."
      schema: { type: string, enum: ["true"] }
  responses:
    Unauthorized:
      description: Missing, malformed, unknown or revoked API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { type: authentication_error, message: "Missing or invalid API key. Use Authorization: Bearer mw_test_… or mw_live_…" } }
    InvalidJson:
      description: The body isn't valid JSON.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { type: invalid_json, message: Body must be valid JSON } }
    ValidationError:
      description: The body is JSON but doesn't match the schema. `fields` maps each dotted path to its messages.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              type: validation_error
              message: The conversation payload is invalid
              fields:
                channel: ["Invalid enum value. Expected 'voice' | 'chat', received 'fax'"]
                transcript: [transcript needs at least one turn]
    NotFound:
      description: Not found in the key's environment.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { type: not_found, message: Conversation not found } }
    ServerError:
      description: Something went wrong on Midwater's side. Safe to retry with the same `Idempotency-Key`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { type: server_error, message: Something went wrong on our side } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              description: Stable machine-readable error type.
              enum: [authentication_error, invalid_json, validation_error, not_found, server_error, not_implemented]
            message: { type: string, description: Human-readable; may change. }
            fields:
              type: object
              description: "Validation errors by dotted path, e.g. `transcript.0.speaker`. `_root` for the body as a whole."
              additionalProperties: { type: array, items: { type: string } }
            docs: { type: string, description: A link to more information (only on `not_implemented`). }
    SafeId:
      type: string
      description: "A letter or digit, then up to 127 letters, digits, `.`, `_`, `:` or `-`. No `/`, so IDs never need URL-encoding."
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
      examples: [front-desk, "brightsmile-dental:receptionist-v3"]
    Speaker:
      type: string
      enum: [agent, user, human_agent]
      description: "`agent` is your AI agent, `user` the caller or chat user, `human_agent` a person who took over."
    Turn:
      type: object
      required: [speaker, text]
      properties:
        speaker: { $ref: "#/components/schemas/Speaker" }
        text: { type: string, minLength: 1 }
        start_ms: { type: integer, minimum: 0, description: Offset from the start of the conversation. }
        end_ms: { type: integer, minimum: 0 }
        asr_confidence: { type: number, minimum: 0, maximum: 1, description: Speech-recognition confidence for this turn (voice). }
    Event:
      type: object
      required: [type]
      description: "Something your agent did: a tool call, a transfer, a handoff. Extra properties are kept. The built-in booking checks turn on the first time a `tool_call` whose `name` contains `book` or `schedul` arrives. A `transfer` or `handoff` event marks the conversation as handed to a person."
      additionalProperties: true
      properties:
        type: { type: string, minLength: 1, examples: [tool_call, transfer, handoff] }
        name: { type: string }
        status: { type: string, examples: [success, error] }
        target: { type: string, description: Where a transfer went. }
        at_ms: { type: integer, minimum: 0 }
    AgentRef:
      type: object
      description: The AI agent that handled the conversation. Omit it to use the project's Default agent.
      properties:
        id: { $ref: "#/components/schemas/SafeId" }
        name: { type: string, minLength: 1, maxLength: 120, description: Shown in Midwater; used when the agent is first created. }
        version: { type: string, maxLength: 60, description: "Your agent's release, e.g. `3.2.0`. Releases are marked on the agent's trend." }
    GroupRef:
      type: object
      required: [id]
      description: Files the agent into this group (created if needed) the first time the agent is seen without one. Ignored once someone places the agent in the app.
      properties:
        id: { $ref: "#/components/schemas/SafeId" }
        name: { type: string, minLength: 1, maxLength: 120 }
    ConversationCreate:
      type: object
      required: [external_id, channel, transcript]
      properties:
        external_id: { type: string, minLength: 1, maxLength: 200, description: Your ID for this call or chat. Unique per environment. }
        channel: { type: string, enum: [voice, chat] }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, description: Defaults to the time Midwater received it. }
        ended_by:
          type: string
          enum: [agent, caller, user, human_agent, timeout, system]
          description: "Who ended the conversation. `timeout` is valid for chat only."
        agent: { $ref: "#/components/schemas/AgentRef" }
        group: { $ref: "#/components/schemas/GroupRef" }
        transcript: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Turn" }, description: "Every turn, in order." }
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        metadata: { type: object, additionalProperties: true, description: Anything else you want kept with the conversation. }
    ConversationStatus:
      type: string
      enum: [queued, evaluating, done, failed]
      description: "Scoring status. `failed` means scoring didn't finish after Midwater's automatic retries (five attempts in all); it can be re-run from the app."
    ConversationAccepted:
      type: object
      required: [id, status]
      properties:
        id: { type: string, description: Midwater's conversation ID. }
        status: { $ref: "#/components/schemas/ConversationStatus" }
        duplicate: { type: boolean, description: "Present and `true` when the `external_id` already existed." }
    Outcome:
      type: ["string", "null"]
      enum: [resolved, unresolved, escalated, not_real_inquiry, null]
      description: |
        How the conversation ended for the caller. `resolved`: Resolved. `unresolved`: Unresolved.
        `escalated`: Handed to a person. `not_real_inquiry`: Not a customer call (sales, spam, wrong number),
        kept out of resolution rates. `null` while scoring, or when no outcome check applied.
    CheckResultValue:
      type: string
      enum: [pass, fail, uncertain, not_applicable, met, not_met]
      description: |
        `pass`: no problem found. `fail`: Midwater found this problem. `uncertain`: unclear; a person should look.
        `not_applicable`: didn't apply to this conversation. `met` / `not_met`: for gating questions
        (for example, whether this was a real customer inquiry).
    DecidedBy:
      type: ["string", "null"]
      enum: [rule, model, llm_judge, human, null]
      description: "`rule`: decided from the events you sent. `model`: Midwater's model read the whole conversation. `llm_judge`: a second review for unclear conversations. `human`: someone on your team."
    CheckResult:
      type: object
      required: [check_key, check_version, check_status, verdict, scorer_version]
      properties:
        check_key: { type: string, description: Stable key of the check; use it with the feedback endpoint. }
        check_name: { type: string }
        check_version: { type: integer }
        check_status: { type: string, enum: [draft, shadow, active], description: "`shadow` checks are scored but never alert." }
        score: { type: ["number", "null"], minimum: 0, maximum: 1, description: "Likelihood that the problem occurred, 0 to 1." }
        verdict: { $ref: "#/components/schemas/CheckResultValue" }
        choice: { type: ["string", "null"], description: The chosen option for multiple-choice checks. }
        decided_by: { $ref: "#/components/schemas/DecidedBy" }
        reason: { type: ["string", "null"], description: One or two sentences on why. }
        evidence_turns: { type: array, items: {}, description: The transcript turns the result points to. }
        scorer_version: { type: string, description: "Midwater's opaque version of how the result was scored, e.g. `2026-10-06.3`." }
        latency_ms: { type: ["integer", "null"] }
    Conversation:
      type: object
      required: [id, external_id, channel, status, outcome, dashboard_url, agent, group, transcript, events, metadata, results]
      properties:
        id: { type: string }
        external_id: { type: string }
        channel: { type: string, enum: [voice, chat] }
        status: { $ref: "#/components/schemas/ConversationStatus" }
        outcome: { $ref: "#/components/schemas/Outcome" }
        dashboard_url: { type: string, format: uri, description: The conversation in the Midwater app. }
        started_at: { type: ["string", "null"], format: date-time }
        ended_at: { type: ["string", "null"], format: date-time }
        ended_by: { type: ["string", "null"] }
        agent:
          type: object
          required: [id, name, version]
          properties:
            id: { type: string }
            name: { type: string }
            version: { type: ["string", "null"] }
        group:
          type: ["object", "null"]
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        transcript: { type: array, items: { $ref: "#/components/schemas/Turn" } }
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        metadata: { type: object, additionalProperties: true }
        results: { type: array, items: { $ref: "#/components/schemas/CheckResult" } }
    FeedbackCreate:
      type: object
      required: [check_key, verdict]
      properties:
        check_key: { type: string, minLength: 1 }
        verdict: { type: string, enum: [pass, fail], description: "Your team's answer: `pass` (no problem) or `fail` (the problem happened)." }
        note: { type: string, maxLength: 1000 }
    Feedback:
      type: object
      required: [id, check_key, verdict, source]
      properties:
        id: { type: string }
        check_key: { type: string }
        verdict: { type: string, enum: [pass, fail] }
        source: { type: string, const: api }
    HealthStatus:
      type: string
      enum: [healthy, watch, at_risk, not_enough_calls]
      description: "`not_enough_calls`: fewer than 5 calls with an outcome in the last 7 days, so nothing is measured yet, unless a high-severity compliance failure puts the agent in `watch` (1) or `at_risk` (2 or more)."
    HealthWindow:
      type: object
      required: [conversations, with_outcome, resolution_rate, handed_to_person_rate, requests_for_person_not_honored, avg_frustration, compliance_failures]
      properties:
        conversations: { type: integer, description: Conversations received in the window. }
        with_outcome: { type: integer, description: Conversations with an outcome (customer calls that were scored). }
        resolution_rate: { type: ["number", "null"], description: Share of conversations with an outcome that were resolved. }
        handed_to_person_rate: { type: ["number", "null"], description: "Share handed to a person (a transfer, or a person requested and provided)." }
        requests_for_person_not_honored: { type: integer, description: Conversations where the caller asked for a person and didn't get one. }
        avg_frustration: { type: ["number", "null"], description: "Average caller frustration, 0 (calm) to 1 (very frustrated)." }
        compliance_failures: { type: integer, description: Compliance checks that failed in the window. }
    AgentHealth:
      type: object
      required: [agent_id, name, environment, health_status, reason, group, last_7_days, last_30_days]
      properties:
        agent_id: { type: string }
        name: { type: string }
        environment: { type: string, enum: [test, live], description: The key's environment; health is measured per environment. }
        health_status: { $ref: "#/components/schemas/HealthStatus" }
        reason: { type: string, description: "Why, in one sentence, e.g. \"Needs 4 more calls with an outcome this week\"." }
        group:
          type: ["object", "null"]
          required: [id, name]
          properties: { id: { type: string }, name: { type: string } }
        last_7_days: { $ref: "#/components/schemas/HealthWindow" }
        last_30_days: { $ref: "#/components/schemas/HealthWindow" }
    GroupHealth:
      type: object
      required: [group_id, name, environment, health_status, reason, agents, last_7_days, last_30_days]
      properties:
        group_id: { type: string }
        name: { type: string }
        environment: { type: string, enum: [test, live] }
        health_status: { $ref: "#/components/schemas/HealthStatus" }
        reason: { type: string, description: Watch and at risk name the agent that set the status. }
        agents:
          type: array
          items:
            type: object
            required: [id, name, health_status]
            properties:
              id: { type: string }
              name: { type: string }
              health_status: { $ref: "#/components/schemas/HealthStatus" }
        last_7_days: { $ref: "#/components/schemas/HealthWindow" }
        last_30_days: { $ref: "#/components/schemas/HealthWindow" }
    WebhookEnvelope:
      type: object
      required: [id, type, environment, created_at, data]
      properties:
        id: { type: string, description: "Event ID, `evt_…`." }
        type: { type: string }
        environment: { type: string, enum: [test, live], description: "Webhooks fire for live conversations, and for test ones only when the destination or route opts in." }
        created_at: { type: string, format: date-time }
        data: { type: object }
    WebhookAgent:
      type: object
      required: [id, name, health_status]
      properties:
        id: { type: string }
        name: { type: string }
        health_status: { $ref: "#/components/schemas/HealthStatus" }
    WebhookGroup:
      type: object
      required: [id, name]
      properties: { id: { type: string }, name: { type: string } }
    ConversationEvaluatedData:
      type: object
      required: [conversation_id, external_id, agent, outcome, results]
      properties:
        conversation_id: { type: string }
        external_id: { type: string }
        agent: { $ref: "#/components/schemas/WebhookAgent" }
        group: { $ref: "#/components/schemas/WebhookGroup" }
        outcome: { $ref: "#/components/schemas/Outcome" }
        results:
          type: array
          items:
            type: object
            required: [check_key, verdict, score, decided_by, shadow]
            properties:
              check_key: { type: string }
              verdict: { $ref: "#/components/schemas/CheckResultValue" }
              score: { type: ["number", "null"] }
              decided_by: { $ref: "#/components/schemas/DecidedBy" }
              shadow: { type: boolean }
    CheckFailedData:
      type: object
      required: [conversation, agent, check, result, url]
      properties:
        conversation:
          type: object
          properties:
            id: { type: string }
            external_id: { type: string }
            channel: { type: string, enum: [voice, chat] }
            agent_version: { type: ["string", "null"] }
            ended_at: { type: ["string", "null"], format: date-time }
        agent: { $ref: "#/components/schemas/WebhookAgent" }
        group: { $ref: "#/components/schemas/WebhookGroup" }
        check:
          type: object
          properties:
            key: { type: string }
            name: { type: string }
            severity: { type: string, enum: [low, medium, high] }
            version: { type: integer }
        result:
          type: object
          properties:
            score: { type: ["number", "null"] }
            verdict: { $ref: "#/components/schemas/CheckResultValue" }
            decided_by: { $ref: "#/components/schemas/DecidedBy" }
            reason: { type: ["string", "null"] }
        url: { type: string, format: uri }
    AgentHealthChangedData:
      type: object
      required: [agent, from, to, last_7_days, last_30_days, url]
      properties:
        agent: { $ref: "#/components/schemas/WebhookAgent" }
        group: { $ref: "#/components/schemas/WebhookGroup" }
        from: { $ref: "#/components/schemas/HealthStatus" }
        to: { $ref: "#/components/schemas/HealthStatus" }
        last_7_days: { $ref: "#/components/schemas/HealthWindow" }
        last_30_days: { $ref: "#/components/schemas/HealthWindow" }
        url: { type: string, format: uri }
    GroupHealthChangedData:
      type: object
      required: [group, from, to, agent, last_7_days, last_30_days, url]
      properties:
        group: { $ref: "#/components/schemas/WebhookGroup" }
        from: { $ref: "#/components/schemas/HealthStatus" }
        to: { $ref: "#/components/schemas/HealthStatus" }
        agent:
          type: ["object", "null"]
          description: The agent whose status set the group's.
          properties: { id: { type: string }, name: { type: string } }
        last_7_days: { $ref: "#/components/schemas/HealthWindow" }
        last_30_days: { $ref: "#/components/schemas/HealthWindow" }
        url: { type: string, format: uri }
